name: Build et publication de l'image samba-ldap-bridge

on:
  push:
    branches: [main]
    paths:
      - 'samba/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./samba
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/samba-ldap-bridge:latest
            ghcr.io/${{ github.repository_owner }}/samba-ldap-bridge:${{ github.sha }}
