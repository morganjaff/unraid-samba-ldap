name: Build et publication des images (samba-ldap-bridge, openldap-samba, lam-samba)

on:
  push:
    branches: [main]
    paths:
      - 'samba/**'
      - 'openldap/**'
      - 'lam/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: samba-ldap-bridge
            context: ./samba
          - image: openldap-samba
            context: ./openldap
          - image: lam-samba
            context: ./lam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Un seul manifeste simple (pas d'index d'attestation) : Unraid sait alors
          # comparer les digests et affiche "à jour" au lieu de "indisponible".
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
